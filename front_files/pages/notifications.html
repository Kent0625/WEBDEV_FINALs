<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - QuarkNet</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-container">
                <a href="feed.html" class="nav-logo">
                    <i class="fas fa-atom"></i>
                    <span>QuarkNet</span>
                </a>
                
                <div class="nav-links">
                    <a href="feed.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                    <a href="notifications.html" class="nav-link active">
                        <i class="fas fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </div>
                
                <div class="nav-actions">
                    <button class="theme-toggle" title="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="logout-btn" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </nav>
        
        <main class="main-content">
            <div class="notifications-container">
                <div class="notifications-header">
                    <h2>Notifications</h2>
                    <div class="notifications-actions">
                        <button class="btn btn-secondary" id="markAllReadBtn">
                            <i class="fas fa-check-double"></i>
                            Mark All Read
                        </button>
                        <button class="btn btn-secondary" id="clearAllBtn">
                            <i class="fas fa-trash"></i>
                            Clear All
                        </button>
                    </div>
                </div>
                
                <div class="notifications-filters">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i>
                        All
                    </button>
                    <button class="filter-btn" data-filter="unread">
                        <i class="fas fa-circle"></i>
                        Unread
                    </button>
                    <button class="filter-btn" data-filter="likes">
                        <i class="fas fa-heart"></i>
                        Likes
                    </button>
                    <button class="filter-btn" data-filter="comments">
                        <i class="fas fa-comment"></i>
                        Comments
                    </button>
                    <button class="filter-btn" data-filter="follows">
                        <i class="fas fa-user-plus"></i>
                        Follows
                    </button>
                </div>
                
                <div class="notifications-list" id="notificationsList">
                    <!-- Notifications will be loaded here -->
                </div>
                
                <div class="empty-state hidden" id="emptyState">
                    <i class="fas fa-bell-slash"></i>
                    <h3>No notifications</h3>
                    <p>You're all caught up! New notifications will appear here.</p>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../src/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            if (!window.quarknet.currentUser) {
                window.location.href = 'login.html';
                return;
            }
            
            // Initialize notifications
            initializeNotifications();
            setupEventListeners();
        });
        
        function initializeNotifications() {
            // Add some sample notifications if none exist
            if (window.quarknet.notifications.length === 0) {
                const sampleNotifications = [
                    {
                        id: Date.now() + 1,
                        type: 'like',
                        message: 'Alex Quantum liked your post about React optimization',
                        userId: window.quarknet.currentUser.id,
                        timestamp: new Date(Date.now() - 30 * 60 * 1000).toISOString(),
                        read: false
                    },
                    {
                        id: Date.now() + 2,
                        type: 'comment',
                        message: 'Sarah Clean commented on your post: "Great insights!"',
                        userId: window.quarknet.currentUser.id,
                        timestamp: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString(),
                        read: false
                    },
                    {
                        id: Date.now() + 3,
                        type: 'follow',
                        message: 'New follower: @tech_enthusiast started following you',
                        userId: window.quarknet.currentUser.id,
                        timestamp: new Date(Date.now() - 4 * 60 * 60 * 1000).toISOString(),
                        read: true
                    },
                    {
                        id: Date.now() + 4,
                        type: 'system',
                        message: 'Welcome to QuarkNet! Your account has been created successfully.',
                        userId: window.quarknet.currentUser.id,
                        timestamp: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString(),
                        read: true
                    }
                ];
                
                window.quarknet.notifications = sampleNotifications;
                window.quarknet.saveData();
            }
            
            loadNotifications();
        }
        
        function loadNotifications(filter = 'all') {
            const userNotifications = window.quarknet.notifications.filter(n => n.userId === window.quarknet.currentUser.id);
            let filteredNotifications = userNotifications;
            
            // Apply filter
            switch(filter) {
                case 'unread':
                    filteredNotifications = userNotifications.filter(n => !n.read);
                    break;
                case 'likes':
                    filteredNotifications = userNotifications.filter(n => n.type === 'like');
                    break;
                case 'comments':
                    filteredNotifications = userNotifications.filter(n => n.type === 'comment');
                    break;
                case 'follows':
                    filteredNotifications = userNotifications.filter(n => n.type === 'follow');
                    break;
            }
            
            const container = document.getElementById('notificationsList');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredNotifications.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                container.innerHTML = filteredNotifications.map(notification => renderNotification(notification)).join('');
            }
            
            // Update unread count in navigation
            updateUnreadCount();
        }
        
        function renderNotification(notification) {
            const timeAgo = window.quarknet.getTimeAgo(notification.timestamp);
            const iconClass = window.quarknet.getNotificationIcon(notification.type);
            const unreadClass = notification.read ? '' : 'unread';
            
            return `
                <div class="notification ${unreadClass}" data-notification-id="${notification.id}">
                    <div class="notification-icon">
                        <i class="${iconClass}"></i>
                    </div>
                    <div class="notification-content">
                        <h4>${notification.message}</h4>
                        <p>${timeAgo}</p>
                    </div>
                    <div class="notification-actions">
                        ${!notification.read ? `
                            <button class="action-btn mark-read-btn" data-notification-id="${notification.id}" title="Mark as read">
                                <i class="fas fa-check"></i>
                            </button>
                        ` : ''}
                        <button class="action-btn delete-btn" data-notification-id="${notification.id}" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }
        
        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const filter = this.dataset.filter;
                    
                    // Update active filter
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Load filtered notifications
                    loadNotifications(filter);
                });
            });
            
            // Mark all as read
            document.getElementById('markAllReadBtn').addEventListener('click', function() {
                const userNotifications = window.quarknet.notifications.filter(n => n.userId === window.quarknet.currentUser.id);
                userNotifications.forEach(notification => {
                    notification.read = true;
                });
                window.quarknet.saveData();
                loadNotifications();
                window.quarknet.showSuccessMessage('All notifications marked as read');
            });
            
            // Clear all notifications
            document.getElementById('clearAllBtn').addEventListener('click', function() {
                if (confirm('Are you sure you want to clear all notifications?')) {
                    window.quarknet.notifications = window.quarknet.notifications.filter(n => n.userId !== window.quarknet.currentUser.id);
                    window.quarknet.saveData();
                    loadNotifications();
                    window.quarknet.showSuccessMessage('All notifications cleared');
                }
            });
            
            // Individual notification actions
            document.addEventListener('click', function(e) {
                if (e.target.closest('.mark-read-btn')) {
                    const notificationId = parseInt(e.target.closest('.mark-read-btn').dataset.notificationId);
                    markAsRead(notificationId);
                }
                
                if (e.target.closest('.delete-btn')) {
                    const notificationId = parseInt(e.target.closest('.delete-btn').dataset.notificationId);
                    deleteNotification(notificationId);
                }
                
                if (e.target.closest('.notification')) {
                    const notificationId = parseInt(e.target.closest('.notification').dataset.notificationId);
                    if (!window.quarknet.notifications.find(n => n.id === notificationId).read) {
                        markAsRead(notificationId);
                    }
                }
            });
        }
        
        function markAsRead(notificationId) {
            const notification = window.quarknet.notifications.find(n => n.id === notificationId);
            if (notification) {
                notification.read = true;
                window.quarknet.saveData();
                loadNotifications();
                window.quarknet.showSuccessMessage('Notification marked as read');
            }
        }
        
        function deleteNotification(notificationId) {
            if (confirm('Are you sure you want to delete this notification?')) {
                window.quarknet.notifications = window.quarknet.notifications.filter(n => n.id !== notificationId);
                window.quarknet.saveData();
                loadNotifications();
                window.quarknet.showSuccessMessage('Notification deleted');
            }
        }
        
        function updateUnreadCount() {
            const userNotifications = window.quarknet.notifications.filter(n => n.userId === window.quarknet.currentUser.id);
            const unreadCount = userNotifications.filter(n => !n.read).length;
            
            // Update notification badge in navigation
            const notificationLink = document.querySelector('a[href="notifications.html"]');
            if (notificationLink) {
                let badge = notificationLink.querySelector('.notification-badge');
                if (unreadCount > 0) {
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'notification-badge';
                        notificationLink.appendChild(badge);
                    }
                    badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                } else if (badge) {
                    badge.remove();
                }
            }
        }
    </script>
    
    <style>
        .notifications-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .notifications-header h2 {
            color: var(--text-primary);
            margin: 0;
        }
        
        .notifications-actions {
            display: flex;
            gap: 1rem;
        }
        
        .notifications-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        
        .filter-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .notification {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: var(--transition);
            position: relative;
        }
        
        .notification:hover {
            background: var(--bg-tertiary);
        }
        
        .notification.unread {
            border-left: 4px solid var(--primary-color);
            background: var(--bg-primary);
        }
        
        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        
        .notification-content {
            flex: 1;
        }
        
        .notification-content h4 {
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 0.95rem;
        }
        
        .notification-content p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin: 0;
        }
        
        .notification-actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: var(--transition);
        }
        
        .notification:hover .notification-actions {
            opacity: 1;
        }
        
        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }
        
        .action-btn:hover {
            background: var(--bg-tertiary);
            color: var(--primary-color);
        }
        
        .delete-btn:hover {
            color: var(--danger-color);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 3rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        
        .empty-state h3 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .notification-badge {
            background: var(--danger-color);
            color: white;
            border-radius: 50%;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 0.5rem;
            min-width: 20px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .notifications-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            
            .notifications-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .notifications-filters {
                justify-content: center;
            }
            
            .filter-btn {
                flex: 1;
                min-width: 80px;
                justify-content: center;
            }
        }
    </style>
</body>
</html>
