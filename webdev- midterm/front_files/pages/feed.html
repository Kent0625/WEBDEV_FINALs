<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - QuarkNet</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-container">
                <a href="feed.html" class="nav-logo">
                    <i class="fas fa-atom"></i>
                    <span>QuarkNet</span>
                </a>
                
                <div class="nav-links">
                    <a href="feed.html" class="nav-link active">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                    <a href="notifications.html" class="nav-link">
                        <i class="fas fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </div>
                
                <div class="nav-actions">
                    <button class="theme-toggle" title="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="logout-btn" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </nav>
        
        <main class="main-content">
            <div class="feed-container">
                <!-- Create Post Section -->
                <div class="create-post-section">
                    <div class="post-form-container">
                        <div class="post-form-header">
                            <div class="user-avatar">
                                <span id="currentUserAvatar">AQ</span>
                            </div>
                            <div class="post-form-info">
                                <h4 id="currentUserName">Alex Quantum</h4>
                                <span id="currentUserUsername">@alex_quark</span>
                            </div>
                        </div>
                        
                        <form class="post-form" id="postForm">
                            <div class="form-group">
                                <textarea id="postContent" name="content" 
                                          placeholder="What's on your mind? Share something thoughtful..." 
                                          rows="4" required></textarea>
                            </div>
                            
                            <div class="post-form-actions">
                                <div class="post-options">
                                    <button type="button" class="option-btn" title="Add image">
                                        <i class="fas fa-image"></i>
                                    </button>
                                    <button type="button" class="option-btn" title="Add link">
                                        <i class="fas fa-link"></i>
                                    </button>
                                    <button type="button" class="option-btn" title="Add location">
                                        <i class="fas fa-map-marker-alt"></i>
                                    </button>
                                </div>
                                
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-paper-plane"></i>
                                    Post
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Posts Feed -->
                <div class="posts-container" id="postsContainer">
                    <!-- Posts will be loaded here by JavaScript -->
                </div>
                
                <!-- Load More Button -->
                <div class="text-center mt-3">
                    <button class="btn btn-secondary" id="loadMoreBtn">
                        <i class="fas fa-sync-alt"></i>
                        Load More Posts
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../src/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            if (!window.quarknet.currentUser) {
                window.location.href = 'login.html';
                return;
            }
            
            // Update user info in the create post section
            const currentUser = window.quarknet.currentUser;
            document.getElementById('currentUserAvatar').textContent = currentUser.avatar;
            document.getElementById('currentUserName').textContent = currentUser.fullName;
            document.getElementById('currentUserUsername').textContent = '@' + currentUser.username;
            
            // Load the feed
            window.quarknet.loadFeed();
            
            // Post Submission
            const postForm = document.getElementById('postForm');
            if (postForm) {
                postForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const textarea = this.querySelector('textarea');
                    const content = textarea.value.trim();
                    
                    if (!content) return;
                    
                    const btn = this.querySelector('button[type="submit"]');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...';
                    btn.disabled = true;
                    
                    const result = await window.quarknet.createPost(content);
                    
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    
                    if (result.success) {
                        textarea.value = '';
                        window.quarknet.loadFeed(); // Reload to show new post
                        window.quarknet.showSuccessMessage('Post created successfully!');
                    } else {
                        window.quarknet.showErrorMessage(result.message);
                    }
                });
            }
            
            // Add event listeners for post options
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const icon = this.querySelector('i');
                    const action = icon.classList[1];
                    
                    let message = '';
                    switch(action) {
                        case 'fa-image':
                            message = 'Image upload feature coming soon!';
                            break;
                        case 'fa-link':
                            message = 'Link preview feature coming soon!';
                            break;
                        case 'fa-map-marker-alt':
                            message = 'Location sharing feature coming soon!';
                            break;
                    }
                    
                    if (message) {
                        window.quarknet.showInfoMessage(message);
                    }
                });
            });
            
            // Load more posts functionality
            document.getElementById('loadMoreBtn').addEventListener('click', function() {
                // Simulate loading more posts
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
                this.disabled = true;
                
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-sync-alt"></i> Load More Posts';
                    this.disabled = false;
                    window.quarknet.showInfoMessage('No more posts to load');
                }, 1000);
            });
        });
    </script>
    
    <style>
        .create-post-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            overflow: hidden;
        }
        
        .post-form-container {
            padding: 1.5rem;
        }
        
        .post-form-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            margin-right: 1rem;
        }
        
        .post-form-info h4 {
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        
        .post-form-info span {
            color: var(--text-light);
            font-size: 0.875rem;
        }
        
        .post-form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }
        
        .post-options {
            display: flex;
            gap: 0.5rem;
        }
        
        .option-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }
        
        .option-btn:hover {
            background: var(--bg-tertiary);
            color: var(--primary-color);
        }
        
        .feed-container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .mention {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .mention:hover {
            text-decoration: underline;
        }
        
        .hashtag {
            color: var(--accent-color);
            text-decoration: none;
        }
        
        .hashtag:hover {
            text-decoration: underline;
        }
    </style>
</body>
</html>
